services:
  habit-tracker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - '8000:8000'
    environment:
      DATABASE_URL: sqlite:////data/habit_tracker.db
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - habit_data:/data
    restart: unless-stopped
volumes:
  habit_data:
